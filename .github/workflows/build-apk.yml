name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor 7+)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm install

      - name: Build Frontend (Vite)
        working-directory: ./client
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Capacitor & Sync Android
        working-directory: ./client
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap sync android

      - name: Set Executable Permissions for Gradle Wrapper
        working-directory: ./client/android
        run: chmod +x ./gradlew

      - name: Build APK (Debug)
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoVideoGenerator-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
